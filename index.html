<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ChatterSnap — live Finnish ↔ English transcription and translation notebook. Everything stays on your device."
    />
    <meta name="theme-color" content="#0b0b0f" />
    <title>ChatterSnap — Finnish ↔ English notebook</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem('chattersnap:settings');
        var theme = stored ? JSON.parse(stored).theme || 'system' : 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
